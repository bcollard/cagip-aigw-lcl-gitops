# ------------------------------------------------------------------- UC2 branch-advisor assistant
# Semantic routing between a fast and a strong Gemini model. Three Models share the targets and
# differ in policies, as the three v1 routes did: assistant (PII), faq (cache, no PII), email
# (template: the PII sanitizer and semantic guard cannot read a templated request).
apiVersion: aiconfiguration.konghq.com/v1alpha1
kind: AIGatewayModel
metadata: { name: lcl-assistant, namespace: lcl, labels: { cagip.io/entity: lcl } }
spec:
  aiGatewayRef: { group: aigateway.konghq.com, kind: OnPremAIGateway, namespacedRef: { name: lcl-aigw } }
  apiSpec:
    type: model
    model:
      name: lcl-assistant
      displayName: LCL · branch-advisor assistant
      capabilities: [generate]
      formats: [{ type: openai }]
      config:
        route: { paths: [/lcl/assistant] }
        # KO nightly f4a00ed bug: the semantic balancer reaches ai-proxy-advanced in the CRD shape
        # (vectordb.type/pgvector, embeddings.name/config) instead of the converter's shape, and the
        # DataPlane rejects the whole push. Intended config, to restore once fixed (JIRA-ko-semantic-balancer.md):
        #   algorithm: semantic
        #   semantic:
        #     embeddings: { name: text-embedding-3-small, provider: lcl-openai, config: { type: openai } }
        #     vectordb: { type: pgvector, pgvector: { host: pgvector.aigw-backends.svc.cluster.local, port: 5432,
        #                 database: semantic, user: kong, password: "{vault://env/aigw-pgvector-password}",
        #                 dimensions: 1536, distanceMetric: cosine, threshold: 0.7 } }
        balancer:
          algorithm: priority            # until then: Flash first, Pro on failure
          priority: { retries: 1, failoverCriteria: [error, timeout, http_429, http_500, http_502, http_503, http_504, non_idempotent] }
        logging: { payloads: Disabled }
      targets:
        - name: gemini-2.5-flash
          provider: { name: lcl-gemini }
          weight: 100
          semanticDescription: questions sur les produits, les frais et les procédures internes de la banque
          config: { type: gemini, gemini: { inputCost: 0.3, outputCost: 2.5 } }
        - name: gemini-2.5-pro
          provider: { name: lcl-gemini }
          weight: 10
          semanticDescription: rédaction ou reformulation d'un email ou d'un courrier à un client
          config: { type: gemini, gemini: { inputCost: 1.25, outputCost: 10 } }
      access:
        authStrategies: [{ name: cagip-oidc-adfs }]
        acls: { type: allow, allow: { allow: [{ name: lcl-agence }, { name: lcl-pole-ia }] } }
      policies:
        - { name: cagip-shared-strip-identity }
        - { name: cagip-shared-baseline-guard }
        - { name: lcl-tags }
        - { name: cagip-shared-pii }
        - { name: lcl-guard-semantic }
        - { name: lcl-advisor-system-prompt }
        - { name: lcl-quota }
---
