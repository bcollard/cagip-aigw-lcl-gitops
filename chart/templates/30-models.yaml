# Cross-provider alias: Claude Code asks for haiku, Gemini answers (real call).
apiVersion: aiconfiguration.konghq.com/v1alpha1
kind: AIGatewayModel
metadata: { name: lcl-claude-haiku, namespace: {{ .Release.Namespace }}, labels: {{ include "lcl.labels" . }} }
spec:
  {{ include "lcl.gatewayRef" . }}
  apiSpec:
    type: model
    model:
      name: claude-haiku-4-5
      displayName: LCL · "Haiku" served by Gemini Flash
      capabilities: [generate]
      formats: [{ type: anthropic }]
      config:
        route: { paths: [/lcl/claude] }
        logging: { payloads: Disabled }
      targets:
        - name: {{ .Values.models.geminiChat }}
          provider: { name: lcl-gemini }
          config: { type: gemini, gemini: { inputCost: 0.3, outputCost: 2.5 } }
      access:
        authStrategies: [{ name: cagip-oidc-adfs }]
        acls: { type: allow, allow: { allow: [{ name: lcl-dev }, { name: lcl-pole-ia }] } }
      policies:
        - { name: cagip-strip-identity }
        - { name: cagip-baseline-guard }
        - { name: lcl-quota }
---
# ------------------------------------------------------------------- UC2 branch-advisor assistant
# Semantic routing between a fast and a strong Gemini model. Three Models share the targets and
# differ in policies, as the three v1 routes did: assistant (PII), faq (cache, no PII), email
# (template: the PII sanitizer and semantic guard cannot read a templated request).
apiVersion: aiconfiguration.konghq.com/v1alpha1
kind: AIGatewayModel
metadata: { name: lcl-assistant, namespace: {{ .Release.Namespace }}, labels: {{ include "lcl.labels" . }} }
spec:
  {{ include "lcl.gatewayRef" . }}
  apiSpec:
    type: model
    model:
      name: lcl-assistant
      displayName: LCL · branch-advisor assistant
      capabilities: [generate]
      formats: [{ type: openai }]
      config:
        route: { paths: [/lcl/assistant] }
        # Semantic routing: each target's semanticDescription is embedded once; a request goes to the
        # closest target (questions → Flash, emails → Pro). Needs Kong Operator ≥ nightly 20261027 (#6240).
        # Threshold 1.0 (cosine distance): the closest target always wins; under 0.7, a question far from
        # both descriptions found no target and got 503 "No peers are available".
        balancer:
          algorithm: semantic
          semantic:
            embeddings: { name: {{ .Values.models.embeddings }}, provider: lcl-openai, config: { type: openai } }
            vectordb: { type: pgvector, pgvector: { host: pgvector.{{ .Values.backendsNamespace }}.svc.cluster.local, port: 5432,
                        database: semantic, user: kong, password: "{vault://env/entity-pgvector-password}",
                        dimensions: {{ .Values.models.embeddingsDimensions }}, distanceMetric: cosine, threshold: 1.0 } }
        logging: { payloads: Disabled }
      targets:
        - name: {{ .Values.models.geminiChat }}
          provider: { name: lcl-gemini }
          weight: 100
          semanticDescription: questions sur les produits, les frais et les procédures internes de la banque
          config: { type: gemini, gemini: { inputCost: 0.3, outputCost: 2.5 } }
        - name: gemini-2.5-pro
          provider: { name: lcl-gemini }
          weight: 10
          semanticDescription: rédaction ou reformulation d'un email ou d'un courrier à un client
          config: { type: gemini, gemini: { inputCost: 1.25, outputCost: 10 } }
      access:
        authStrategies: [{ name: cagip-oidc-adfs }]
        acls: { type: allow, allow: { allow: [{ name: lcl-agence }, { name: lcl-pole-ia }] } }
      policies:
        - { name: cagip-strip-identity }
        - { name: cagip-baseline-guard }
        - { name: lcl-pii }
        - { name: lcl-guard-semantic }
        - { name: lcl-advisor-system-prompt }
        - { name: lcl-quota }
---
