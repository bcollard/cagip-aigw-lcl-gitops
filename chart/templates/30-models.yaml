# LCL's Models. v1 had one ai-proxy-advanced plugin per HTTPRoute; v2 has one AIGatewayModel per
# client-visible model name. KO's converter emits the route, ai-model-selector, ai-proxy-advanced
# and one model-scoped plugin per policy. config.route.paths is a BASE path: the format adds the
# endpoint (anthropic → /v1/messages, openai → /chat/completions, /embeddings).
# Clients select the Model with the body `model` field (the Model's apiSpec.model.name).
#
# Every Model carries what CAGIP's chart requires (VAP aigw-models): the auth strategy
# cagip-oidc-adfs and the policies cagip-strip-identity and cagip-baseline-guard. lcl-quota is
# LCL's usage plan.
#
# ------------------------------------------------------------------- UC1 Claude Code (/lcl/claude)
# Three Models on one base path: Claude Code sends {"model": "<name>"} to /lcl/claude/v1/messages.
apiVersion: aiconfiguration.konghq.com/v1alpha1
kind: AIGatewayModel
metadata: { name: lcl-claude-sonnet, namespace: {{ .Release.Namespace }}, labels: {{ include "lcl.labels" . }} }
spec:
  {{ include "lcl.gatewayRef" . }}
  apiSpec:
    type: model
    model:
      name: claude-sonnet-4-6
      displayName: LCL · Claude Sonnet 4.6 (Vertex, on-prem fallback)
      capabilities: [generate]
      formats: [{ type: anthropic }]
      config:
        route: { paths: [/lcl/claude] }
        balancer:
          algorithm: priority            # highest weight first: Vertex, then the on-prem model
          priority:
            retries: 2
            # non_idempotent: LLM calls are POSTs, which nginx never retries without it.
            failoverCriteria: [error, timeout, http_429, http_500, http_502, http_503, http_504, non_idempotent]
            maxFails: 3
            failTimeout: 30
        logging: { payloads: Disabled }
      targets:
        - name: claude-sonnet-4-6        # claude-* on Vertex → publishers/anthropic, :rawPredict
          weight: 100
          provider: { name: lcl-vertex }
          config:
            type: gemini
            gemini:
              inputCost: 3
              outputCost: 15
              gcpEnvironment: { apiEndpoint: "{{ .Values.vertex.endpoint }}", projectID: "{{ .Values.vertex.project }}", locationID: "{{ .Values.vertex.location }}" }
        - name: {{ .Values.models.onprem }}
          weight: 10
          provider: { name: lcl-onprem }
          config:
            type: openai
            openai: { upstreamURL: "http://ollama.{{ .Values.backendsNamespace }}.svc.cluster.local:11434/v1/chat/completions" }
      access:
        authStrategies: [{ name: cagip-oidc-adfs }]
        acls: { type: allow, allow: { allow: [{ name: lcl-dev }, { name: lcl-pole-ia }] } }
      policies:
        - { name: cagip-strip-identity }
        - { name: cagip-baseline-guard }
        - { name: lcl-quota }
---
