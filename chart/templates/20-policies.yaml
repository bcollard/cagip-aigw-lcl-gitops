# LCL's consumer groups and AI policies: prompts, guardrails, cache, usage plan. Attached to
# Models through policies[]: global policies and Lua belong to CAGIP's chart (VAP aigw-policies).
#
# ------------------------------------------------------------------- consumer groups
# Filled at request time from the ADFS `groups` claim (cagip-oidc-adfs consumerGroupsClaim).
apiVersion: aiconfiguration.konghq.com/v1alpha1
kind: AIGatewayConsumerGroup
metadata: { name: lcl-dev, namespace: {{ .Release.Namespace }}, labels: {{ include "lcl.labels" . }} }
spec:
  {{ include "lcl.gatewayRef" . }}
  apiSpec: { name: lcl-dev, displayName: LCL developers }
---
apiVersion: aiconfiguration.konghq.com/v1alpha1
kind: AIGatewayConsumerGroup
metadata: { name: lcl-agence, namespace: {{ .Release.Namespace }}, labels: {{ include "lcl.labels" . }} }
spec:
  {{ include "lcl.gatewayRef" . }}
  apiSpec: { name: lcl-agence, displayName: LCL branch advisors }
---
apiVersion: aiconfiguration.konghq.com/v1alpha1
kind: AIGatewayConsumerGroup
metadata: { name: lcl-pole-ia, namespace: {{ .Release.Namespace }}, labels: {{ include "lcl.labels" . }} }
spec:
  {{ include "lcl.gatewayRef" . }}
  apiSpec: { name: lcl-pole-ia, displayName: LCL AI team }
---
# ------------------------------------------------------------------- prompts
apiVersion: aiconfiguration.konghq.com/v1alpha1
kind: AIGatewayPolicy
metadata: { name: lcl-advisor-system-prompt, namespace: {{ .Release.Namespace }}, labels: {{ include "lcl.labels" . }} }
spec:
  {{ include "lcl.gatewayRef" . }}
  apiSpec:
    name: lcl-advisor-system-prompt
    displayName: LCL · advisor system prompt
    type: ai-prompt-decorator
    global: Disabled
    config:
      type: inline
      value:
        prompts:
          prepend:
            - role: system
              content: >-
                Tu es l'assistant des conseillers LCL. Réponds en français, en trois phrases au plus.
                Pas de conseil en investissement personnalisé.
---
apiVersion: aiconfiguration.konghq.com/v1alpha1
kind: AIGatewayPolicy
metadata: { name: lcl-email-template, namespace: {{ .Release.Namespace }}, labels: {{ include "lcl.labels" . }} }
spec:
  {{ include "lcl.gatewayRef" . }}
  apiSpec:
    name: lcl-email-template
    displayName: LCL · customer email template
    type: ai-prompt-template
    global: Disabled
    config:
      type: inline
      value:
        allow_untemplated_requests: true
        templates:
          - name: reponse-client
            template: |-
              {"messages": [{"role": "user",
                "content": "Rédige un email de réponse à {{`{{client}}`}} au sujet de {{`{{sujet}}`}}, sur un ton {{`{{ton}}`}}."}]}
---
# ------------------------------------------------------------------- guardrails, cache
apiVersion: aiconfiguration.konghq.com/v1alpha1
kind: AIGatewayPolicy
metadata: { name: lcl-guard-semantic, namespace: {{ .Release.Namespace }}, labels: {{ include "lcl.labels" . }} }
spec:
  {{ include "lcl.gatewayRef" . }}
  apiSpec:
    name: lcl-guard-semantic
    displayName: LCL · semantic prompt guard
    type: ai-semantic-prompt-guard
    global: Disabled
    config:
      type: inline
      value:
        embeddings:
          model: { provider: openai, name: {{ .Values.models.embeddings }} }
          auth: { header_name: Authorization, header_value: "{vault://env/entity-openai-bearer}" }
        vectordb:
          strategy: pgvector
          dimensions: {{ .Values.models.embeddingsDimensions }}
          distance_metric: cosine
          threshold: 0.6                 # measured in v1: 0.6 blocks the deny topics, passes banking questions
          pgvector: { host: pgvector.{{ .Values.backendsNamespace }}.svc.cluster.local, port: 5432, database: semantic, user: kong,
                      password: "{vault://env/entity-pgvector-password}", ssl: false, ssl_required: false }
        search: { threshold: 0.5 }
        rules:
          deny_prompts:
            - Pour qui voter aux élections, quel parti ou candidat politique soutenir ?
            - Comment harceler, menacer ou intimider une personne ?
            - Comment fabriquer une arme ou une bombe, commettre un acte violent ou terroriste ?
---
# PII sanitizer (AI PII Anonymizer service): masks customer data in prompts, restores it in answers.
# Never on a Model with a semantic cache: the cache is keyed on the MASKED prompt and stores the
# RESTORED answer (v1 finding, JIRA-semantic-cache-pii-leak).
apiVersion: aiconfiguration.konghq.com/v1alpha1
kind: AIGatewayPolicy
metadata: { name: lcl-pii, namespace: {{ .Release.Namespace }}, labels: {{ include "lcl.labels" . }} }
spec:
  {{ include "lcl.gatewayRef" . }}
  apiSpec:
    name: lcl-pii
    displayName: LCL · PII sanitizer
    type: ai-sanitizer
    global: Disabled
    config:
      type: inline
      value:
        host: ai-pii-service.{{ .Values.backendsNamespace }}.svc.cluster.local
        port: 8080
        sanitization_mode: INPUT
        anonymize: [general, email, phone, creditcard, bank, nationalid]
        recover_redacted: true
---
apiVersion: aiconfiguration.konghq.com/v1alpha1
kind: AIGatewayPolicy
metadata: { name: lcl-cache-faq, namespace: {{ .Release.Namespace }}, labels: {{ include "lcl.labels" . }} }
spec:
  {{ include "lcl.gatewayRef" . }}
  apiSpec:
    name: lcl-cache-faq
    displayName: LCL · FAQ semantic cache
    type: ai-semantic-cache
    global: Disabled
    config:
      type: inline
      value:
        cache_ttl: 3600
        message_countback: 1
        ignore_system_prompts: true
        embeddings:
          model: { provider: openai, name: {{ .Values.models.embeddings }} }
          auth: { header_name: Authorization, header_value: "{vault://env/entity-openai-bearer}" }
        vectordb:
          strategy: pgvector
          dimensions: {{ .Values.models.embeddingsDimensions }}
          distance_metric: cosine
          threshold: 0.1
          pgvector: { host: pgvector.{{ .Values.backendsNamespace }}.svc.cluster.local, port: 5432, database: semantic, user: kong,
                      password: "{vault://env/entity-pgvector-password}", ssl: false, ssl_required: false }
---
# ------------------------------------------------------------------- quotas
# One policy, referenced by every LCL Model. Each reference becomes its own plugin instance;
# they share one budget through the same counter namespace in Redis.
apiVersion: aiconfiguration.konghq.com/v1alpha1
kind: AIGatewayPolicy
metadata: { name: lcl-quota, namespace: {{ .Release.Namespace }}, labels: {{ include "lcl.labels" . }} }
spec:
  {{ include "lcl.gatewayRef" . }}
  apiSpec:
    name: lcl-quota
    displayName: LCL · token and cost quotas
    type: ai-rate-limiting-advanced
    global: Disabled
    config:
      type: inline
      value:
        namespace: lcl-tokens
        strategy: redis
        sync_rate: 1
        redis: { host: redis.{{ .Values.backendsNamespace }}.svc.cluster.local, port: 6379 }
        decrease_by_fractions_in_redis: true
        policies:                            # append only: counters are keyed by position
          - limits: [{ limit: 2000000, window_size: 86400, tokens_count_strategy: total_tokens }]
          - match: [{ type: consumer_group, values: [lcl-dev] }]
            limits: [{ limit: 10, window_size: 86400, tokens_count_strategy: cost }]
          - match: [{ type: consumer_group, values: [lcl-agence] }]
            limits: [{ limit: 300000, window_size: 86400, tokens_count_strategy: total_tokens }]
          - match: [{ type: model, values: ["claude-opus-*"] }]
            limits: [{ limit: 200000, window_size: 86400, tokens_count_strategy: total_tokens }]
          - match: [{ type: model, partition_by: true }]
            limits: [{ limit: 1000000, window_size: 86400, tokens_count_strategy: total_tokens }]
          # New in AI GW 2.2: per-employee budget on the OIDC credential (CAGIP's auth strategy
          # credentialClaim: upn in ADFS, preferred_username in the lab). Every matching policy
          # applies, so a named employee's plan (match values: [<upn>]) can only be stricter.
          - match: [{ type: credential, partition_by: true }]
            limits: [{ limit: 500000, window_size: 86400, tokens_count_strategy: total_tokens }]
