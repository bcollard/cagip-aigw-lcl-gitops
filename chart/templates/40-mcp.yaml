# LCL's MCP server: two REST endpoints of the agences API exposed as MCP tools.
# v1: ai-mcp-proxy (conversion-listener) whose tools called back THROUGH Kong to a second route
# (/lcl/agences) that carried the OIDC + acl plugins. v2: the server-level ACL and the auth
# strategy are part of the MCP server, so the tools call the backend directly.
apiVersion: aiconfiguration.konghq.com/v1alpha1
kind: AIGatewayMCPServer
metadata: { name: lcl-mcp-agences, namespace: {{ .Release.Namespace }}, labels: {{ include "lcl.labels" . }} }
spec:
  {{ include "lcl.gatewayRef" . }}
  apiSpec:
    type: conversion-listener
    conversion-listener:
      name: lcl-mcp-agences
      displayName: LCL · agences (MCP)
      config:
        url: http://agences-api.{{ .Values.backendsNamespace }}.svc.cluster.local
        route: { paths: [/lcl/mcp] }
      tools:
        - name: list_agences
          description: Liste les agences LCL d'une ville
          method: GET
          path: /anything/agences
        - name: get_agence
          description: Détail d'une agence par son code
          method: GET
          path: /anything/agence
      access:
        aclAttributeType: consumer
        consumer:
          authStrategies: [{ name: cagip-oidc-adfs }]
          acls: { allow: [{ name: lcl-agence }, { name: lcl-pole-ia }] }
